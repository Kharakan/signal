# Displayname template for Signal users.
# {{.ProfileName}} - The Signal profile name set by the user.
# {{.ContactName}} - The name for the user from your phone's contact list. This is not safe on multi-user instances.
# {{.Nickname}} - The nickname set for the user in the native Signal app. This is not safe on multi-user instances.
# {{.PhoneNumber}} - The phone number of the user.
# {{.UUID}} - The UUID of the Signal user.
# {{.AboutEmoji}} - The emoji set by the user in their profile.
displayname_template: '{{or .ProfileName .PhoneNumber "Unknown user"}}'
# Should avatars from the user's contact list be used? This is not safe on multi-user instances.
use_contact_avatars: false
# Should the bridge request the user's contact list from the phone on startup?
sync_contacts_on_startup: true
# Should the bridge sync ghost user info even if profile fetching fails? This is not safe on multi-user instances.
use_outdated_profiles: false
# Should the Signal user's phone number be included in the room topic in private chat portal rooms?
number_in_topic: true
# Default device name that shows up in the Signal app.
device_name: mautrix-signal
# Avatar image for the Note to Self room.
note_to_self_avatar: mxc://maunium.net/REBIVrqjZwmaWpssCZpBlmlL
# Format for generating URLs from location messages for sending to Signal.
# Google Maps: 'https://www.google.com/maps/place/%[1]s,%[2]s'
# OpenStreetMap: 'https://www.openstreetmap.org/?mlat=%[1]s&mlon=%[2]s'
location_format: 'https://www.google.com/maps/place/%[1]s,%[2]s'
# Should view-once messages disappear shortly after sending a read receipt on Matrix?
disappear_view_once: false
# Should polls be sent using unstable MSC3381 event types?
extev_polls: false
# Preserve deletions and edits (fork-local feature, not in upstream mautrix-signal).
#
# When enabled, deleted/edited messages from Signal are NOT redacted or
# overwritten in Matrix. Instead, the deleted text is kept and annotated with
# strikethrough plus a marker line. Edits keep their previous version(s)
# visible inline as a small audit trail.
#
# Disabled by default. Enable globally with default_enabled, or per-user via
# the `!signal preserve-deletions on` bot command (overrides the default).
preserve_deletions_and_edits:
    # Master switch. A user's bot-command override takes precedence over this.
    default_enabled: false
    # Marker line templates. Placeholders:
    #   {timestamp} - rendered using timestamp_format below
    #   {count}     - number of edits so far (only used in edited_multi)
    #   {n}         - version index (only used in version_label)
    markers:
        redacted: "🗑️ Deleted by sender • {timestamp}"
        edited: "✏️ Edited • {timestamp}"
        edited_multi: "✏️ Edited ({count}×) • {timestamp}"
        original_label: "Original:"
        version_label: "v{n}:"
    # Go time.Format layout. See https://pkg.go.dev/time#Layout
    timestamp_format: "2006-01-02 15:04"
    # How many previous versions to show below an edited message.
    # 0 = only the direct predecessor (strikethrough'd).
    max_edit_history: 3
